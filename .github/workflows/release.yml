name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installation des dépendances
        run: npm install

      - name: Compilation du code (TypeScript vers JavaScript)
        run: npm run build

      - name: Empaquetage du plugin
        run: npx @elgato/cli pack ca.qg-gbcm.streamdeck.unraid.sdPlugin

      - name: Publication sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: "**/*.streamDeckPlugin" 
          name: "Unraid Stream Deck v${{ github.ref_name }}"
          generate_release_notes: true