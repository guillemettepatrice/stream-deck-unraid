name: Build and Release Stream Deck Plugin

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Pack Plugin
        run: npx @elgato/cli pack ca.qg-gbcm.streamdeck.unraid.sdPlugin -o release/

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./release/ca.qg-gbcm.streamdeck.unraid.streamDeckPlugin
          asset_name: ca.qg-gbcm.streamdeck.unraid.streamDeckPlugin
          asset_content_type: application/zip